name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/padlink/app src/main/res/drawable
          mv *.kt src/main/java/com/padlink/app/
          mv AndroidManifest.xml src/main/
          mv ic_launcher.xml src/main/res/drawable/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PadLink-debug-apk
          path: build/outputs/apk/debug/*.apk
